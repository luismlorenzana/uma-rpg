<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Template</title>
<!-- The Tier rework's preview template. Copy this whole <style> block into each preview; keep files self-contained.
     Colours are uma-kit's theme tokens (uma-platform/packages/kit/theme.css): light is uma-racer's, dark is uma-rpg's. -->
<style>
  :root {
    --page: #edf1f6; --panel: #ffffff; --raised: #f3f6fa; --sunken: #e4eaf2;
    --ink: #101a24; --ink-soft: #5a6b84; --ink-faint: #8a98ac;
    --accent: #d39a2b; --accent-strong: #b87f18; --accent-wash: #fbf1dd; --accent-ink: #1b1406;
    --success: #2f7a4f; --danger: #c23b33; --warning: #d08a0e; --info: #2f6fe0; --locked: #8a94a3;
    --phys: #c2643a; --magic: #5b6ee0; --heal: #2f9a6a;
    --t1: #e8c25a; --t2: #c07a3a; --t3: #7a5ad0;
    --hairline: rgb(16 26 36 / 0.08); --hairline-strong: rgb(16 26 36 / 0.16);
    --radius: 12px; --gap: 12px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0f1620; --panel: #17202b; --raised: #1f2a37; --sunken: #0b1118;
      --ink: #e9eef4; --ink-soft: #a6b3c2; --ink-faint: #6f7d8e;
      --accent: #d6a23e; --accent-strong: #e8b65a; --accent-wash: #2b2312;
      --success: #4fb37a; --danger: #e0645c; --warning: #e0a33a; --info: #5b8def;
      --phys: #e08a5e; --magic: #8b9cff; --heal: #4fc08c;
      --hairline: rgb(255 255 255 / 0.08); --hairline-strong: rgb(255 255 255 / 0.16);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, 'Inter', sans-serif; }
  main { max-width: 430px; margin: 0 auto; padding: 16px; }
  main.wide { max-width: 1100px; }
  h1 { font: 700 20px/1.2 ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; margin: 4px 0 12px; }
  h2 { font: 700 16px/1.25 ui-rounded, system-ui, sans-serif; margin: 20px 0 8px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); margin: 14px 0 6px; }
  p, li { color: var(--ink-soft); }
  .card { background: var(--panel); border-radius: var(--radius); padding: 12px; margin-bottom: var(--gap);
    box-shadow: 0 1px 0 var(--hairline-strong); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    background: var(--sunken); color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .chip.phys { background: color-mix(in srgb, var(--phys) 18%, transparent); color: var(--phys); }
  .chip.magic { background: color-mix(in srgb, var(--magic) 18%, transparent); color: var(--magic); }
  .chip.heal { background: color-mix(in srgb, var(--heal) 18%, transparent); color: var(--heal); }
  .chip.locked { color: var(--locked); }
  .tier { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; color: #1b1406; }
  .tier.t1 { background: var(--t1); } .tier.t2 { background: var(--t2); color: #fff; } .tier.t3 { background: var(--t3); color: #fff; }
  .slot { width: 44px; height: 44px; border-radius: 10px; background: var(--raised); border: 1px solid var(--hairline-strong);
    display: grid; place-items: center; font-size: 11px; font-weight: 700; text-align: center; }
  .slot.empty { border-style: dashed; color: var(--ink-faint); background: transparent; }
  .muted { color: var(--ink-faint); }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--hairline); text-align: left; vertical-align: top; }
  th { color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
  /* Trees: nodes are .node inside .tree columns; .edge draws a connector. */
  .tree { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .tier-row { display: flex; gap: 10px; justify-content: center; }
  .node { min-width: 64px; max-width: 120px; padding: 6px 8px; border-radius: 10px; background: var(--raised);
    border: 1.5px solid var(--hairline-strong); font-size: 11px; font-weight: 600; text-align: center; }
  .node.core { border-color: var(--accent); background: var(--accent-wash); }
  .node.pick { border-style: dashed; }
  .node.locked { opacity: .45; }
  .edge { width: 2px; height: 14px; background: var(--hairline-strong); margin: 0 auto; }
  .legend { font-size: 12px; color: var(--ink-faint); }
  nav.tabs { display: flex; gap: 6px; margin: 8px 0 12px; flex-wrap: wrap; }
  nav.tabs a { padding: 4px 10px; border-radius: 999px; background: var(--sunken); color: var(--ink); text-decoration: none; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Preview title</h1>
  <p>One line on what this shows and which doc it belongs to.</p>
  <div class="card">
    <div class="row"><span class="tier t1">Tier 1</span><span class="chip phys">Physical</span><span class="chip magic">Magical</span><span class="chip heal">Healer</span></div>
  </div>
</main>
</body>
</html>
