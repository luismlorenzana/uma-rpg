<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="l2d-token" content="%TOKEN%">
  <title>L2D Review</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/vendor/spine.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <div class="title">
      <h1>L2D Review</h1>
      <p id="status" aria-live="polite">Loading…</p>
    </div>
    <div class="filters">
      <label>Show <select id="filter"></select></label>
      <label>Group <select id="group"></select></label>
      <label class="search">Find <input id="search" type="search" placeholder="Name or id" autocomplete="off"></label>
    </div>
    <p id="counts"></p>
  </header>
  <main>
    <section class="viewer">
      <div class="who">
        <img id="face" alt="" width="56" height="56">
        <div><h2 id="name"></h2><p id="meta"></p></div>
      </div>
      <div class="poses" id="poses" role="group" aria-label="Pose"></div>
      <div class="stage">
        <canvas id="canvas"></canvas>
        <p id="message" hidden></p>
      </div>
    </section>
    <section class="formats" aria-label="Rendered images">
      <div class="formats-head">
        <h2>Formats</h2>
        <div class="formats-actions">
          <button id="render" type="button">Render this one</button>
          <button id="batch" type="button">Render all with a role</button>
        </div>
      </div>
      <p id="render-status" aria-live="polite"></p>
      <div id="renders"></div>
    </section>
  </main>
  <footer>
    <div class="votes" id="votes"></div>
    <div class="nav">
      <button id="back" type="button" title="Previous (←)">← Back</button>
      <button id="undo" type="button" title="Undo (Z)">Undo</button>
      <button id="skip" type="button" title="Next (→)">Skip →</button>
    </div>
  </footer>
</body>
</html>
